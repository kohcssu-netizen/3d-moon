<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Moon App</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 25, 0.9);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #3a3a5a;
            z-index: 10; 
            pointer-events: auto;
            max-width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: #e0e0ff; 
            border-bottom: 1px solid #3a3a5a;
            padding-bottom: 5px;
        }
        .data-item {
            margin: 12px 0;
            font-size: 0.95rem;
        }
        .label {
            color: #8a8ab0;
            font-weight: bold;
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .value {
            font-family: monospace;
            color: #00ffcc;
            font-size: 1.1rem;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        .coord-input {
            width: 50%;
            background: #12122b;
            border: 1px solid #3a3a5a;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .go-btn {
            width: 100%;
            margin-top: 8px;
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .go-btn:hover {
            background: #00cca3;
        } 
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 10;
            pointer-events: none;
            border: 1px solid #222;
            text-align: center;
        }
    </style>
    <!-- Include Three.js and OrbitControls -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>LUNAR TELEMETRY</h1>
        <div class="data-item">
            <span class="label">Target Status</span>
            <span id="status-val" class="value" style="color: #ff9900;">SELECT A REGION</span>
        </div>
        <div class="data-item">
            <span class="label">Coordinates</span>
            <span id="coords-val" class="value">-</span>
        </div>
        <div class="data-item">
            <span class="label">Day Temperature (Sunlit)</span>
            <span id="day-temp-val" class="value">-</span>
        </div>
        <div class="data-item">
            <span class="label">Night Temperature (Shadow)</span>
            <span id="night-temp-val" class="value">-</span>
        </div>
        <div class="data-item">
            <span class="label">Day Radiation (Solar + Cosmic)</span>
            <span id="day-rad-val" class="value">-</span>
        </div>
        <div class="data-item">
            <span class="label">Night Radiation (Cosmic Background)</span>
            <span id="night-rad-val" class="value">-</span>
        </div>

        <div style="border-top: 1px solid #3a3a5a; margin-top: 15px; padding-top: 10px;">
            <span class="label">Manual Target Entry</span>
            <div class="input-group">
                <input type="number" id="lat-input" class="coord-input" placeholder="Lat (-90 to 90)" min="-90" max="90" step="any">
                <input type="number" id="lon-input" class="coord-input" placeholder="Lon (-180 to 180)" min="-180" max="180" step="any">
            </div>
            <button class="go-btn" onclick="navigateToInputCoords()">Go to Coordinates</button> 
        </div>
    </div>

    <div id="instructions">
        Drag to rotate | Scroll to zoom | Click on Moon or Enter Coordinates | Watch shadows shift!
    </div>

    <script>
        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 28);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5.0;
        controls.maxDistance = 60;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.08);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // Helper to draw seamless circles on canvas
        function drawSeamlessCircle(ctx, x, y, r, fillStyle, width) {
            ctx.fillStyle = fillStyle;
            const offsets = [-width, 0, width];
            for (let ox of offsets) {
                ctx.beginPath();
                ctx.arc(x + ox, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Helper to draw seamless radial gradients
        function drawSeamlessRadialGradient(ctx, x, y, r, stops, width) {
            const offsets = [-width, 0, width];
            for (let ox of offsets) {
                const grad = ctx.createRadialGradient(x + ox, y, 0, x + ox, y, r);
                for (let stop of stops) {
                    grad.addColorStop(stop.offset, stop.color);
                }
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x + ox, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Procedural Textures ---
        function createMoonTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;

            // Gray background base
            ctx.fillStyle = '#83838b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Seamless Dark Lunar Maria
            for (let i = 0; i < 12; i++) {
                const x = Math.random() * w;
                const y = Math.random() * canvas.height;
                const rx = Math.random() * 150 + 60;
                const ry = Math.random() * 100 + 40;
                const maxR = Math.max(rx, ry);

                const stops = [
                    { offset: 0, color: '#424248' },
                    { offset: 0.6, color: '#56565e' },
                    { offset: 1, color: 'transparent' }
                ];

                const offsets = [-w, 0, w];
                for (let ox of offsets) {
                    ctx.save();
                    ctx.translate(x + ox, y);
                    ctx.rotate(Math.random() * Math.PI);
                    ctx.scale(rx / ry, 1);
                    
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
                    for (let stop of stops) {
                        grad.addColorStop(stop.offset, stop.color);
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, ry, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // Seamless Micro craters
            for (let i = 0; i < 350; i++) {
                const x = Math.random() * w;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 12 + 1.5;

                drawSeamlessCircle(ctx, x, y, r, 'rgba(28, 28, 30, 0.45)', w);
                drawSeamlessCircle(ctx, x + r * 0.12, y + r * 0.12, r * 0.88, 'rgba(185, 185, 195, 0.28)', w);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createMoonBumpMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;

            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Seamless bump map craters

for (let i = 0; i < 500; i++) {
const x = Math.random() * w;
const y = Math.random() * canvas.height;
const r = Math.random() * 18 + 1;
const stops = [
{ offset: 0, color: '#000000' },
{ offset: 0.85, color: '#ffffff' },
{ offset: 1, color: '#808080' }
];
drawSeamlessRadialGradient(ctx, x, y, r, stops, w);
}
return new THREE.CanvasTexture(canvas);
}
function createEarthTexture() {
const canvas = document.createElement('canvas');
canvas.width = 1024;
canvas.height = 512;
const ctx = canvas.getContext('2d');
const w = canvas.width;
// Dull, realistic ocean base color
ctx.fillStyle = '#1c2d42';
ctx.fillRect(0, 0, canvas.width, canvas.height);
// Create Continent shapes with seamless transitions
for (let i = 0; i < 45; i++) {
const cx = Math.random() * w;
const cy = Math.random() * canvas.height;
const cr = Math.random() * 140 + 40;
const coastalStops = [
{ offset: 0, color: '#2e4c2e' },
{ offset: 0.5, color: '#223822' },
{ offset: 0.8, color: '#1e2b3d' },
{ offset: 1, color: 'transparent' }
];
drawSeamlessRadialGradient(ctx, cx, cy, cr, coastalStops, w);
const innerStops = [
{ offset: 0, color: '#a68c5b' },
{ offset: 0.5, color: '#3a4f2e' },
{ offset: 1, color: 'transparent' }
];
drawSeamlessRadialGradient(ctx, cx, cy, cr * 0.6, innerStops, w);
}
// Few seamless clouds
ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
for (let i = 0; i < 12; i++) {
const cx = Math.random() * w;
const cy = Math.random() * canvas.height;
const cw = Math.random() * 180 + 50;
const ch = Math.random() * 30 + 8;
const angle = (Math.random() * 0.4 - 0.2);
const offsets = [-w, 0, w];
for (let ox of offsets) {
ctx.save();
ctx.translate(cx + ox, cy);
ctx.rotate(angle);
ctx.beginPath();
ctx.ellipse(0, 0, cw, ch, 0, 0, Math.PI * 2);
ctx.fill();
ctx.restore();
}
}
return new THREE.CanvasTexture(canvas);
}
function createSunTexture() {
const canvas = document.createElement('canvas');
canvas.width = 512;
canvas.height = 256;
const ctx = canvas.getContext('2d');
// Monotone warm orange color scheme with smooth linear sunset-like gradient
const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
grad.addColorStop(0, '#ff7d1a');
grad.addColorStop(0.5, '#e65c00');
grad.addColorStop(1, '#cc4400');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);
return new THREE.CanvasTexture(canvas);
}
// --- Set up Mesh Objects ---
// Earth-to-Moon radius ratio is approximately 3.67 to 1
const EARTH_RADIUS = 8.5;
const MOON_RADIUS = 2.32;
// Interactive Moon sphere
const geometry = new THREE.SphereGeometry(MOON_RADIUS, 64, 64);
const material = new THREE.MeshStandardMaterial({
map: createMoonTexture(),
bumpMap: createMoonBumpMap(),
bumpScale: 0.16,
roughness: 0.92,
metalness: 0.08
});
const moon = new THREE.Mesh(geometry, material);
moon.receiveShadow = true;
moon.castShadow = true;
scene.add(moon);
// Background Earth sphere (scaled relative to Moon's interactive focus)
const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
const earthMaterial = new THREE.MeshStandardMaterial({
map: createEarthTexture(),
roughness: 0.65,
metalness: 0.1
});
const earth = new THREE.Mesh(earthGeometry, earthMaterial);
earth.position.set(-28, 4, -18);
scene.add(earth);
// Glowing Monotone Orange Sun sphere
const sunGeometry = new THREE.SphereGeometry(2.3, 32, 32);
const sunMaterial = new THREE.MeshBasicMaterial({
map: createSunTexture()
});
const sunVisual = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sunVisual);
// Navigation Marker
const markerGeometry = new THREE.ConeGeometry(0.12, 0.4, 8);
markerGeometry.rotateX(Math.PI / 2);
const markerMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
const marker = new THREE.Mesh(markerGeometry, markerMaterial);
marker.visible = false;
moon.add(marker);
// Deep space Stars
const starsGeometry = new THREE.BufferGeometry();
const starsCount = 1500;
const starsPositions = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount; i++) {
const u = Math.random();
const v = Math.random();
const theta = u * 2.0 * Math.PI;
const phi = Math.acos(2.0 * v - 1.0);
const r = 180 + Math.random() * 40;
starsPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
starsPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
starsPositions[i * 3 + 2] = r * Math.cos(phi);
}
starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true });
const starField = new THREE.Points(starsGeometry, starsMaterial);
scene.add(starField);
// --- Telemetry Interaction Logic ---
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const statusVal = document.getElementById('status-val');
const coordsVal = document.getElementById('coords-val');
const dayTempVal = document.getElementById('day-temp-val');
const nightTempVal = document.getElementById('night-temp-val');
const dayRadVal = document.getElementById('day-rad-val');
const nightRadVal = document.getElementById('night-rad-val');
window.addEventListener('click', onPointerDown, false);
function updateTelemetry(lat, lon, localPoint) {
statusVal.innerText = "LOCKED";
statusVal.style.color = "#00ffcc";
coordsVal.innerText = ${lat.toFixed(2)}° N, ${lon.toFixed(2)}° E;
// Generate physical dynamic values
const latRad = lat * (Math.PI / 180);
const latFactor = Math.cos(latRad);
const dayTemp = 120 * latFactor;
const nightTemp = -130 - (40 * (1 - latFactor));
dayTempVal.innerText = ${dayTemp.toFixed(1)} °C;
nightTempVal.innerText = ${nightTemp.toFixed(1)} °C;
const baseCosmicRad = 11.2;
const radFluctuation = Math.abs(Math.sin(latRad * 4.5)) * 4.2;
const nightRad = baseCosmicRad + radFluctuation;
const dayRad = nightRad + 8.5;
dayRadVal.innerText = ${dayRad.toFixed(2)} μSv/h;
nightRadVal.innerText = ${nightRad.toFixed(2)} μSv/h;
const markerPos = localPoint.clone().multiplyScalar(MOON_RADIUS);
marker.position.copy(markerPos);
marker.lookAt(new THREE.Vector3(0, 0, 0));
marker.visible = true;
}
let targetRotationY = 0;
let targetRotationX = 0;
let isInterpolating = false;
function focusOnPoint(localPoint) {
targetRotationY = Math.atan2(-localPoint.x, localPoint.z);
targetRotationX = Math.asin(localPoint.y);
isInterpolating = true;
}
function navigateToInputCoords() {
let lat = parseFloat(document.getElementById('lat-input').value);
let lon = parseFloat(document.getElementById('lon-input').value);
if (isNaN(lat) || lat < -90 || lat > 90) lat = 0;
if (isNaN(lon) || lon < -180 || lon > 180) lon = 0;
const phi = (90 - lat) * (Math.PI / 180);
const theta = (lon + 180) * (Math.PI / 180);
const x = -(Math.sin(phi) * Math.sin(theta));
const y = Math.cos(phi);
const z = Math.sin(phi) * Math.cos(theta);
const localPoint = new THREE.Vector3(x, y, z).normalize();
updateTelemetry(lat, lon, localPoint);
focusOnPoint(localPoint);
}
function onPointerDown(event) {
if (event.clientX < 340 && event.clientY < 450) return;
mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
raycaster.setFromCamera(mouse, camera);
const intersects = raycaster.intersectObject(moon);
if (intersects.length > 0) {
const point = intersects[0].point;
const localPoint = moon.worldToLocal(point.clone());
localPoint.normalize();
const latitude = Math.asin(localPoint.y) * (180 / Math.PI);
const longitude = Math.atan2(localPoint.z, localPoint.x) * (180 / Math.PI);
updateTelemetry(latitude, longitude, localPoint);
}
}
// --- Render Animation ---
let time = 0;
function animate() {
requestAnimationFrame(animate);
time += 0.0012;
const sunX = Math.cos(time) * 45;
const sunZ = Math.sin(time) * 45;
sunLight.position.set(sunX, 6, sunZ);
sunVisual.position.set(sunX, 6, sunZ);
sunVisual.rotation.y -= 0.0025;
earth.rotation.y += 0.0015;
if (isInterpolating) {
moon.rotation.y += (targetRotationY - moon.rotation.y) * 0.05;
moon.rotation.x += (targetRotationX - moon.rotation.x) * 0.05;
if (Math.abs(moon.rotation.y - targetRotationY) < 0.002 &&
Math.abs(moon.rotation.x - targetRotationX) < 0.002) {
isInterpolating = false;
}
} else {
moon.rotation.y += 0.0004;
}
controls.update();
renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
animate();
